name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Preflight
        run: npm run doctor
      - name: Tests
        run: npm test
      - name: Demo (all six requests must match)
        run: |
          npm run demo > demo-output.txt
          npm run -s demo -- --json > demo-result.json
          node -e 'const r = require("./demo-result.json"); console.log(`${r.passed}/${r.total} requests matched`); process.exit(r.ok ? 0 : 1)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-run
          path: |
            demo-output.txt
            demo-result.json
